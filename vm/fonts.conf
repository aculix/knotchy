<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Pages ask for Mac and Windows fonts; without these they all fall back to DejaVu Sans. -->
<fontconfig>
  <alias binding="same"><family>system-ui</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>ui-sans-serif</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>San Francisco</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Roboto</family><prefer><family>Inter Variable</family><family>Inter</family></prefer></alias>

  <alias><family>sans-serif</family><prefer><family>Inter Variable</family><family>Inter</family><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family><family>DejaVu Serif</family></prefer></alias>

  <!-- Menlo is derived from DejaVu Sans Mono. -->
  <alias binding="same"><family>ui-monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>SFMono-Regular</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Monaco</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>

  <alias binding="same"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Apple Color Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Symbol</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
